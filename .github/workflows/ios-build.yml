
name: Build Avengers Widget for iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: AvengersDoomsdayWidget_GitHubActions_Starter
        run: xcodegen generate --spec project.yml

      - name: Build for iPhone device
        working-directory: AvengersDoomsdayWidget_GitHubActions_Starter
        run: |
          xcodebuild \
            -project AvengersDoomsdayWidget.xcodeproj \
            -scheme AvengersDoomsdayWidget \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos/AvengersDoomsdayWidget.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr AvengersDoomsdayWidget-unsigned.ipa Payload

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: Avengers-Widget-iPhone-Unsigned
          path: ${{ runner.temp }}/AvengersDoomsdayWidget-unsigned.ipa
          if-no-files-found: error
