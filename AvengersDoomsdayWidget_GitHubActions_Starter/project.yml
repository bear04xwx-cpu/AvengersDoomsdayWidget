name: AvengersDoomsdayWidget
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AvengersDoomsdayWidget:
    type: application
    platform: iOS
    sources:
      - path: AvengersDoomsdayWidget/AvengersDoomsdayWidgetApp.swift
      - path: AvengersDoomsdayWidget/Views
      - path: AvengersDoomsdayWidget/Shared
      - path: AvengersDoomsdayWidget/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AvengersDoomsdayWidget
        INFOPLIST_KEY_CFBundleDisplayName: Doomsday Countdown
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: AvengersDoomsdayWidgetExtension
        embed: true
  AvengersDoomsdayWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AvengersDoomsdayWidget/Widgets
      - path: AvengersDoomsdayWidget/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AvengersDoomsdayWidget.widget
        INFOPLIST_KEY_CFBundleDisplayName: Doomsday Countdown Widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies: []
